name: Framework Quality Gate
description: Build, test, validate package consumers, and verify publication artifacts.
outputs:
  manifest-sha256:
    description: SHA256 of the exact validated package artifact manifest.
    value: ${{ steps.packages.outputs.manifest-sha256 }}
runs:
  using: composite
  steps:
    - name: Verify dependency boundaries and solution inventory
      shell: pwsh
      run: |
        python ./scripts/Test-ProjectHierarchy.py
        if ($LASTEXITCODE -ne 0) { throw 'Adopted project hierarchy validation failed.' }

    - name: Build and run all solution tests without warnings
      shell: pwsh
      run: ./scripts/Invoke-FrameworkTests.ps1 -Project vc.Ifx.slnx -Configuration Release -WarningsAsErrors

    - name: Validate packages and isolated compiler consumers
      id: packages
      shell: pwsh
      run: ./scripts/Invoke-FrameworkTests.ps1 -BuildOnly -Project scripts/packaging/CompilerHostSmoke.proj -Configuration Release -WarningsAsErrors

    - name: Verify stable release tag matches package versions
      if: startsWith(github.ref, 'refs/tags/v')
      shell: pwsh
      env:
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'NuGet releases require a stable vX.Y.Z tag.' }
        $manifest = Get-Content -LiteralPath (Join-Path $env:IFX_PACKAGE_UPLOAD_DIRECTORY 'package-manifest.json') -Raw | ConvertFrom-Json
        foreach ($package in $manifest.packages) {
          if ($package.version -cne $env:RELEASE_TAG.Substring(1)) { throw "$($package.id) version does not match the release tag." }
        }

    - name: Recheck exact upload inventory
      shell: pwsh
      env:
        PACKAGE_REVISION: ${{ github.sha }}
        PACKAGE_MANIFEST_SHA256: ${{ steps.packages.outputs.manifest-sha256 }}
      run: |
        Import-Module ./scripts/packaging/PackageArtifactManifest.psm1
        $null = Test-PackageArtifactManifest -Directory $env:IFX_PACKAGE_UPLOAD_DIRECTORY -Revision $env:PACKAGE_REVISION -ManifestSha256 $env:PACKAGE_MANIFEST_SHA256
